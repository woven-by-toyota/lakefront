name: Version Bump Check
# Description:
  # In this workflow we check for keywords in commit message to determine if
  # a specific version bump is necessary. This check runs on every push and can
  # perform version updates before and during a pull request.

on:
  push:
    branches-ignore:
      - main
      # gh-pages holds the Storybook and the dependency report, not source, so a push there must not
      # try to bump a version
      - gh-pages

permissions:
  contents: write

jobs:
  check_push_version_bump:
    name: 'Check Push Version Bump'
    # Stops this job bumping its own bump commit. The marker is [bump] because GitHub acts on
    # [skip ci] itself and would stop every other workflow from running on that commit too.
    if: "!contains(github.event.head_commit.message, '[bump]')"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'
      - name: "Determine commit range"
        id: range
        run: |
          before="${{ github.event.before }}"
          if [[ "$before" =~ ^0+$ ]]; then
            echo "range=${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          else
            echo "range=${before}..${{ github.event.after }}" >> "$GITHUB_OUTPUT"
          fi
      - name: "Automated Version Bump (Push)"
        uses: ./.github/actions/bump-version
        with:
          commit-range: ${{ steps.range.outputs.range }}
          ref: ${{ github.ref_name }}
          skip-tag:  'true'
          minor-wording:  'minor,Minor,MINOR,add,Adds,ADD,ADDS,new,New,NEW,feat,Feat,FEAT,feature,Feature,FEATURE,features,Features,FEATURES'
          major-wording:  'major,MAJOR,cut-major,Cut-Major,break,Break,BREAK,breaking,Breaking,BREAKING'
          patch-wording:  'patch,Patch,PATCH,patches,Patches,PATCHES,fix,Fix,FIX,fixes,Fixes,FIXES'
          rc-wording:     'RELEASE,alpha'
          github-token: ${{ secrets.GITHUB_TOKEN }}
