name: Deploy GH Pages
on:
  push:
    branches:
      - main
    paths: ["src/**"] # Trigger the action only when files change in the folders defined here

permissions:
  contents: write

concurrency:
  # Shared with dependency-check.yml: both publish to gh-pages and this one force-pushes it, so
  # they must not run at the same time.
  group: 'gh-pages-publish'
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'
      - name: Install and Build
        run: | # Install npm packages and build the Storybook files
          npm ci
          npm run build-storybook
      - name: Deploy to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: | # Force-push the built folder as the whole content of gh-pages
          # The push below replaces the branch wholesale, so anything on it the Storybook build does
          # not produce has to be carried across first. dependencies/ is the nightly report from
          # dependency-check.yml, and is absent until that workflow has run once, hence the guards.
          if git fetch --depth 1 origin gh-pages; then
            git archive FETCH_HEAD dependencies | tar -x -C docs-build || true
          fi
          cd docs-build
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy Storybook for ${GITHUB_SHA}"
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:gh-pages
