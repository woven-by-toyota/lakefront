name: Pull Request Check
# Description:
  # In this workflow we run our tests and automated versioning.

# Jobs:
  # Test Pull Request
    # Here we perform a clean installation, run all tests
    # and verify we can build the project successfully.
  # Automated Version Patch
    # Keyword-based bumps already run on push (see versionBumpCheck.yml), so
    # this job is a safety net: it applies a plain patch bump if the PR branch
    # still has the same package.json version as the base branch.

on:
  pull_request:
    branches:
      - 'main'

jobs:
  test_pull_request:
    name: 'Test Pull Request'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v6
      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'
      - run: npm ci
      - run: npm test
      - run: npm run build
  automated_version_patch:
    name: "Automated Version Patch"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout source code"
        uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: "Setup Node.js"
        uses: actions/setup-node@v6
        with:
          node-version: '26.x'
      - name: "Version Check"
        id: check
        run: |
          git fetch origin "${{ github.event.pull_request.base.sha }}" --depth=1
          base_version="$(git show "${{ github.event.pull_request.base.sha }}:package.json" | node -e 'process.stdout.write(JSON.parse(require("fs").readFileSync(0,"utf8")).version)')"
          head_version="$(node -pe "require('./package.json').version")"
          if [ "$base_version" = "$head_version" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$head_version" >> "$GITHUB_OUTPUT"
          fi
      - name: "Apply Patch If Required"
        if: steps.check.outputs.changed == 'false'
        uses: ./.github/actions/bump-version
        with:
          commit-range: ${{ github.event.pull_request.base.sha }}..${{ github.sha }}
          ref: ${{ github.head_ref }}
          default-bump: 'patch'
          skip-tag: 'true'
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: "No Version Bump Required"
        if: steps.check.outputs.changed == 'true'
        run: 'echo "No bump required. Version already updated to ${{ steps.check.outputs.version }} in this PR."'

